# Bazaaro: poora stack ek command se.
#   docker compose up --build        (pehli baar ya code badalne ke baad)
#   docker compose up -d             (background mein)
#   docker compose down              (band, data bacha rehta hai)
#   docker compose down -v           (band + database ka data bhi saaf)
#
# Website:   http://localhost:5173
# API:       http://localhost:5000
# MongoDB:   localhost:27017  (Compass ya mongosh se jud sakte ho)
#
# Streaming (Kafka) alag se on hota hai, normal `up` mein nahi chalta:
#   docker compose --profile streaming up -d
# Kafka (laptop se): localhost:29092   Kafka UI: http://localhost:8080
# Backend events bhejne ke liye server/.env mein EVENTS_ENABLED=true karo. Details: docs/EVENTS.md
#
# server/.env mein tumhari keys (JWT_SECRET, Stripe, SMTP, Google) hi use hoti hain.
# Sirf MONGO_URI yahan se badal jata hai, kyunke container ke andar Mongo ka naam "mongo" hai.
name: bazaaro

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - path: ./server/.env
        required: false
    environment:
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/bazaaro
      CLIENT_URL: http://localhost:5173
      KAFKA_BROKERS: kafka:9092
    ports:
      - "5000:5000"
    volumes:
      # Upload ki hui images host par bhi rehti hain (seedDemo isi folder se images leta hai)
      - ./server/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"

  # ── Streaming profile: sirf `--profile streaming` ke saath chalta hai ──
  kafka:
    profiles: [streaming]
    image: apache/kafka:3.9.0
    restart: unless-stopped
    ports:
      - "29092:29092"
    environment:
      # KRaft single node (Zookeeper ki zaroorat nahi): broker + controller ek hi container
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # kafka:9092 = Docker ke andar walon ke liye, localhost:29092 = tumhare laptop ke liye
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    profiles: [streaming]
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: bazaaro
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

volumes:
  mongo-data:
  kafka-data:
